<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe — Personal Profile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #f5f5f5;
      color: #333;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .subtitle {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 2rem;
    }
    .wireframe {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border: 2px solid #333;
    }

    /* Section base */
    .section {
      border: 1px dashed #999;
      margin: 1rem;
      padding: 1rem;
      position: relative;
    }
    .section-label {
      position: absolute;
      top: -10px;
      left: 10px;
      background: #fff;
      padding: 0 8px;
      font-size: 0.7rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
    }

    /* Nav */
    .nav-wire {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border: 1px dashed #999;
      margin: 1rem;
    }
    .nav-wire .logo {
      width: 40px;
      height: 40px;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .nav-wire .links {
      display: flex;
      gap: 1.5rem;
    }
    .nav-wire .links span {
      width: 60px;
      height: 8px;
      background: #ddd;
      display: block;
    }
    .nav-wire .cta {
      width: 80px;
      height: 28px;
      border: 2px solid #333;
    }

    /* Hero */
    .hero-wire {
      padding: 3rem 1rem;
      text-align: center;
    }
    .hero-wire .status-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2rem;
    }
    .hero-wire .status-bar span {
      width: 100px;
      height: 8px;
      background: #ddd;
    }
    .hero-wire .title-line {
      height: 32px;
      background: #ddd;
      margin: 0.5rem auto;
      max-width: 600px;
    }
    .hero-wire .title-line.short { max-width: 400px; }
    .hero-wire .title-line.accent { background: #ccc; }
    .hero-wire .subtitle-line {
      height: 12px;
      background: #eee;
      max-width: 350px;
      margin: 1.5rem auto;
    }
    .hero-wire .scroll-indicator {
      width: 60px;
      height: 8px;
      background: #ddd;
      margin: 2rem auto 0;
    }

    /* Marquee */
    .marquee-wire {
      padding: 1rem;
      text-align: center;
    }
    .marquee-wire .track {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    .marquee-wire .track span {
      width: 100px;
      height: 10px;
      background: #ddd;
    }

    /* About */
    .about-wire {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    .about-wire .text-block .lead {
      height: 16px;
      background: #ccc;
      margin-bottom: 1rem;
    }
    .about-wire .text-block .line {
      height: 10px;
      background: #eee;
      margin-bottom: 0.5rem;
    }
    .about-wire .facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .about-wire .fact-box {
      border: 1px solid #ccc;
      padding: 1rem;
      text-align: center;
    }
    .about-wire .fact-box .num {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 0.25rem;
    }
    .about-wire .fact-box .label {
      width: 60px;
      height: 6px;
      background: #ddd;
      margin: 0 auto;
    }

    /* Skills */
    .skills-wire {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    .skills-wire .card {
      border: 1px solid #ccc;
      padding: 1.5rem;
    }
    .skills-wire .card .icon {
      width: 24px;
      height: 24px;
      border: 2px solid #333;
      margin-bottom: 1rem;
    }
    .skills-wire .card .title {
      height: 14px;
      background: #ccc;
      width: 70%;
      margin-bottom: 0.75rem;
    }
    .skills-wire .card .desc {
      height: 8px;
      background: #eee;
      margin-bottom: 0.4rem;
    }
    .skills-wire .card .tags {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .skills-wire .card .tags span {
      width: 50px;
      height: 16px;
      background: #ddd;
      border-radius: 10px;
    }

    /* Work */
    .work-wire .work-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0;
      border-bottom: 1px dashed #ccc;
    }
    .work-wire .work-item:last-child { border-bottom: none; }
    .work-wire .work-item .info .year {
      width: 40px;
      height: 6px;
      background: #ddd;
      margin-bottom: 0.5rem;
    }
    .work-wire .work-item .info .title {
      height: 18px;
      background: #ccc;
      width: 250px;
      margin-bottom: 0.5rem;
    }
    .work-wire .work-item .info .desc {
      height: 8px;
      background: #eee;
      width: 350px;
    }
    .work-wire .work-item .meta {
      text-align: right;
    }
    .work-wire .work-item .meta .role {
      width: 80px;
      height: 6px;
      background: #ddd;
      margin-left: auto;
      margin-bottom: 0.5rem;
    }
    .work-wire .work-item .meta .arrow {
      font-size: 1.2rem;
    }

    /* Writing */
    .writing-wire {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    .writing-wire .card {
      border: 1px solid #ccc;
      padding: 1.5rem;
    }
    .writing-wire .card .date {
      width: 60px;
      height: 6px;
      background: #ddd;
      margin-bottom: 0.75rem;
    }
    .writing-wire .card .title {
      height: 12px;
      background: #ccc;
      margin-bottom: 0.5rem;
    }
    .writing-wire .card .desc {
      height: 8px;
      background: #eee;
      margin-bottom: 0.4rem;
    }
    .writing-wire .card .read {
      width: 40px;
      height: 6px;
      background: #ccc;
      margin-top: 1rem;
    }

    /* Contact */
    .contact-wire {
      text-align: center;
      padding: 3rem 1rem;
    }
    .contact-wire .title {
      height: 28px;
      background: #ccc;
      max-width: 300px;
      margin: 0 auto 1rem;
    }
    .contact-wire .sub {
      height: 10px;
      background: #eee;
      max-width: 250px;
      margin: 0 auto 1.5rem;
    }
    .contact-wire .email {
      height: 20px;
      background: #ccc;
      max-width: 200px;
      margin: 0 auto 2rem;
    }
    .contact-wire .socials {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }
    .contact-wire .socials span {
      width: 70px;
      height: 8px;
      background: #ddd;
    }

    /* Footer */
    .footer-wire {
      display: flex;
      justify-content: space-between;
      padding: 1rem;
      border: 1px dashed #999;
      margin: 1rem;
    }
    .footer-wire span {
      width: 100px;
      height: 8px;
      background: #ddd;
    }

    /* Annotations */
    .annotation {
      font-size: 0.65rem;
      color: #999;
      font-style: italic;
      margin-top: 0.5rem;
    }

    @media (max-width: 768px) {
      .about-wire { grid-template-columns: 1fr; }
      .skills-wire { grid-template-columns: 1fr; }
      .writing-wire { grid-template-columns: 1fr; }
      .nav-wire .links { display: none; }
    }
  </style>
</head>
